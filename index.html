<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>1kfvr</title>
    <meta name="description" content="Portfolio of Andrew Rudman  video editor & music producer." />
    <link rel="icon" type="image/png" href="Images/1k fvr logo 4_000002_00000.png" />
    <link rel="apple-touch-icon" href="Images/1k fvr logo 4_000002_00000.png" />
    <style>
        :root{
            --bg:#ffffff;
            --text:#3a3a3a;
            --muted:#5a5a5a;
            --panel:#ffffff;
            --outline:#bdbdbd;
            --shadow:0 8px 20px rgba(0,0,0,0.1);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            color-scheme: light;
        }
        *{box-sizing:border-box}
        body{
            margin:0;
            background:var(--bg);
            color:var(--text);
            height:100vh;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            padding:20px;
        }
        .logo{
            width:120px;
            height:120px;
            border-radius:20px;
            margin-bottom:30px;
            overflow:hidden;
        }
        .logo img{
            width:100%;
            height:100%;
            object-fit:contain;
            display:block;
        }
        h1{
            margin:0 0 10px 0;
            font-size:2rem;
        }
        .buttons{
            display:flex;
            flex-direction:column;
            gap:18px;
            width:100%;
            max-width:760px;
        }
        .btn{
            background:var(--panel);
            color:var(--text);
            padding:62px 60px;
            border-radius:16px;
            border:3px solid var(--outline);
            font-weight:600;
            font-size:1.5rem;
            text-align:center;
            text-decoration:none;
            letter-spacing:0.2px;
            transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease;
            box-shadow:var(--shadow);
            animation:buttonIdle 6.2s ease-in-out infinite;
        }
        .btn:nth-child(2){animation-duration:7.1s;animation-delay:-1.4s}
        .btn:nth-child(3){animation-duration:6.7s;animation-delay:-2.2s}
        .btn:hover{
            animation-play-state:paused;
            transform:translateY(-4px);
            border-color:#a8a8a8;
            box-shadow:0 12px 28px rgba(0,0,0,0.14);
        }
        @keyframes buttonIdle{
            0%{transform:translate3d(0,0,0)}
            25%{transform:translate3d(1px,-2px,0)}
            50%{transform:translate3d(-1px,1px,0)}
            75%{transform:translate3d(1px,2px,0)}
            100%{transform:translate3d(0,0,0)}
        }
        @media (max-width:700px){
            .btn{padding:46px 24px;font-size:1.2rem;border-radius:14px}
        }
    </style>
</head>
<body>
    <div class="buttons">
        <a class="btn" href="/shop">Shop</a>
        <a class="btn" href="https://linktr.ee/Adjustors_" target="_blank" rel="noopener">Socials</a>
        <a class="btn" href="/contact">Contact</a>
    </div>
</body>
</html>
