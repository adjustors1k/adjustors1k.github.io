<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact — 1kfvr</title>
  <meta name="description" content="Contact Andrew Rudman (adjustors1k)." />
  <link rel="icon" type="image/png" href="Images/1k fvr logo 4_000002_00000.png" />
  <link rel="apple-touch-icon" href="Images/1k fvr logo 4_000002_00000.png" />
  <script>
    // Redirect contact.html to /contact for cleaner URLs (only on web server, not local file)
    if (window.location.protocol !== 'file:' && window.location.pathname.endsWith('contact.html')) {
      window.location.replace('/contact');
    }
  </script>
  <style>
    :root{--bg:#ffffff;--text:#3a3a3a;--muted:#5a5a5a;--surface:#ffffff;--outline:#bdbdbd;--outline-strong:#a8a8a8;--glass:rgba(0,0,0,0.06);--radius:14px;--gap:18px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;color-scheme:light}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.45;padding:28px}
    a{color:var(--text);text-decoration:none}
    .container{max-width:1140px;margin:0 auto}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
    .brand{display:flex;gap:12px;align-items:center}
    .logo{width:48px;height:48px;border-radius:10px;background:#ececec;border:2px solid var(--outline);display:grid;place-items:center}
    .logo img{width:100%;height:100%;object-fit:contain;border-radius:8px;display:block}
    nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
    .nav-link{font-size:0.95rem;color:var(--muted);padding:8px 10px;border-radius:8px}
    .nav-link:hover{background:var(--glass);color:var(--text)}
    .layout{display:block}
    .card{background:var(--surface);border-radius:var(--radius);padding:20px;border:3px solid var(--outline);box-shadow:0 8px 20px rgba(0,0,0,0.1)}
    .heading{margin:0;font-size:2rem;line-height:1.1}
    .contact-grid{display:grid;gap:10px;grid-template-columns:1fr 1fr}
    input,textarea{padding:11px 12px;border-radius:10px;border:2px solid var(--outline);background:#ffffff;color:var(--text);width:100%;font:inherit;transition:border-color .2s ease, box-shadow .2s ease}
    input:focus,textarea:focus{outline:none;border-color:var(--outline-strong);box-shadow:0 0 0 3px rgba(0,0,0,0.06)}
    .btn{background:#ffffff;color:var(--text);padding:10px 14px;border-radius:10px;font-weight:600;border:2px solid var(--outline);cursor:pointer;transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease}
    .btn:hover{transform:translateY(-2px);border-color:var(--outline-strong);box-shadow:0 10px 24px rgba(0,0,0,0.12)}
    footer{margin-top:30px;text-align:center;color:var(--muted);font-size:0.9rem}
    @media (max-width: 900px){
      .contact-grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="logo" aria-hidden>
          <img src="Images/1k fvr logo 4_000002_00000.png" alt="1k fvr logo" />
        </div>
        <div>
          <div style="font-weight:700">@adjustors1k</div>
        </div>
      </div>
      <nav>
  <a class="nav-link" href="/">Home</a>
        <a class="nav-link" href="/about">About</a>
        <a class="nav-link" href="/shop">Shop</a>
        <a class="nav-link" href="/contact">Contact</a>
        <a class="nav-link" href="https://linktr.ee/Adjustors_" target="_blank" rel="noopener">Socials</a>
      </nav>
    </header>

    <main class="layout">
      <section class="card">
        <h1 class="heading">Contact</h1>
        <form id="contactForm" style="margin-top:14px;display:grid;gap:12px;max-width:740px">
          <div class="contact-grid">
            <input id="name" name="name" placeholder="Your name" required />
            <input id="email" type="email" name="email" placeholder="Email" required />
          </div>
          <input id="subject" name="subject" placeholder="Subject" />
          <textarea id="message" name="message" placeholder="Message" rows="6" required></textarea>
          <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
            <button type="submit" class="btn">Send message</button>
            <div style="color:var(--muted);font-size:0.95rem">Or email: <a href="mailto:adjustors2900@gmail.com">adjustors2900@gmail.com</a></div>
          </div>
        </form>
      </section>
    </main>

    <footer>
      <div><span class="badge-font">1k forever®</span> 2025</div>
    </footer>
  </div>

  <script>
    document.getElementById('contactForm').addEventListener('submit', function(e){
      e.preventDefault();
      const f = e.target;
      const name = encodeURIComponent(f.name.value.trim());
      const email = encodeURIComponent(f.email.value.trim());
      const subject = encodeURIComponent(f.subject.value.trim() || 'Contact from portfolio');
      const body = encodeURIComponent((f.message.value.trim() || '') + "\n\n— " + (f.name.value.trim() || ''));
      const mailto = `mailto:adjustors2900@gmail.com?subject=${subject}&body=${body}%0A%0AFrom:%20${name}%20<${email}>`;
      window.location.href = mailto;
    });
  </script>
</body>
</html>
